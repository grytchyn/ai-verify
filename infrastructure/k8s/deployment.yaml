# AI-Verify Kubernetes — Deployment Manifests
---
apiVersion: v1
kind: Namespace
metadata:
  name: ai-verify
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-verify-secrets
  namespace: ai-verify
type: Opaque
stringData:
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  PINECONE_API_KEY: ${PINECONE_API_KEY}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
  JWT_SECRET: ${JWT_SECRET}
  DB_PASSWORD: ${DB_PASSWORD}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-verify-api
  namespace: ai-verify
spec:
  selector:
    app: ai-verify-api
  ports:
    - port: 3001
      targetPort: 3001
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-verify-api
  namespace: ai-verify
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ai-verify-api
  template:
    metadata:
      labels:
        app: ai-verify-api
    spec:
      containers:
        - name: api
          image: ai-verify-backend:latest
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: "production"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-verify-secrets
                  key: OPENAI_API_KEY
            - name: PINECONE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-verify-secrets
                  key: PINECONE_API_KEY
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-verify-secrets
                  key: STRIPE_SECRET_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ai-verify-secrets
                  key: JWT_SECRET
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: ai-verify-secrets
                  key: DB_PASSWORD
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-verify-ai-engine
  namespace: ai-verify
spec:
  selector:
    app: ai-verify-ai-engine
  ports:
    - port: 3002
      targetPort: 3002
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-verify-ai-engine
  namespace: ai-verify
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ai-verify-ai-engine
  template:
    metadata:
      labels:
        app: ai-verify-ai-engine
    spec:
      containers:
        - name: ai-engine
          image: ai-verify-ai-engine:latest
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-verify-secrets
                  key: OPENAI_API_KEY
            - name: PINECONE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-verify-secrets
                  key: PINECONE_API_KEY
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1"
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-verify-api-hpa
  namespace: ai-verify
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-verify-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-verify-ingress
  namespace: ai-verify
spec:
  rules:
    - host: api.ai-verify.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-verify-api
                port:
                  number: 3001
    - host: ai.ai-verify.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-verify-ai-engine
                port:
                  number: 3002
